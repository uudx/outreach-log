<script>
const data = JSON.parse(document.querySelector('#data').textContent);
const formatter = new Intl.DateTimeFormat('ru-RU', {
  timeZone: data.timeZone, dateStyle: 'medium', timeStyle: 'medium'
});
const query = document.querySelector('#query');
const statusFilter = document.querySelector('#status');
const statuses = {replied:'Есть ответ', waiting:'Пока без ответа', bounced:'Не доставлено', automatic:'Автоответ', unchecked:'Не проверено'};
const stages = {
  first_email:'Первое письмо',
  first_reply:'Первый ответ',
  discussing:'Обсуждается',
  in_progress:'В работе',
  completed:'Выполнено',
  closed:'Закрыто',
  undelivered:'Не доставлено'
};
const stageKey = 'outreach-log:stages:v1';
let stageOverrides = {};
try {
  stageOverrides = JSON.parse(localStorage.getItem(stageKey) || '{}') || {};
} catch {}
function currentStage(item) {
  const saved = stageOverrides[item.gmailThreadId];
  if (Object.hasOwn(stages, saved)) return saved;
  if (item.replyStatus === 'replied') return 'first_reply';
  if (item.replyStatus === 'bounced') return 'undelivered';
  return 'first_email';
}
const list = document.querySelector('#letters');
const count = document.querySelector('#count');
function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content) node.textContent = content;
  if (className) node.className = className;
  return node;
}
function letter(item) {
  const details = element('details');
  const summary = element('summary');
  const date = element('time', formatter.format(new Date(item.sentAt)));
  date.dateTime = item.sentAt;
  const meta = element('span', '', 'meta');
  meta.append(element('strong', item.company), date);
  summary.append(meta, element('span', item.subject, 'subject'),
    element('span', statuses[item.replyStatus], 'status ' + item.replyStatus));
  const stage = element('span');
  function showStage(value) {
    stage.className = 'stage ' + value;
    stage.textContent = stages[value];
  }
  showStage(currentStage(item));
  summary.append(stage);
  const message = element('div', '', 'message');
  message.append(element('p', 'Кому — ' + item.to, 'address'), element('p', item.body, 'body'));
  const gmailUrl = 'https://mail.google.com/mail/u/0/#all/' + item.gmailThreadId;
  const prompt = [
    'Помоги Нуржану продолжить переговоры с ' + item.company + ' об автоматизации.',
    'Открой подключённый Gmail, прочитай всю цепочку по ID ' + item.gmailThreadId + ' (' + gmailUrl + ').',
    'Проверь последнее входящее письмо и подготовь ответ в этой же цепочке. Если ответа ещё нет, предложи следующий шаг. Если Gmail недоступен, попроси меня вставить последнее письмо. Перед отправкой покажи черновик.',
    'Кому: ' + item.to,
    'Тема: ' + item.subject,
    'Исходное предложение:\n' + item.body
  ].join('\n\n');
  const actions = element('div', '', 'actions');
  for (const [label, url] of [
    ['Открыть в Gmail', gmailUrl],
    ['Продолжить с ChatGPT', 'https://chatgpt.com/?q=' + encodeURIComponent(prompt)]
  ]) {
    const link = element('a', label);
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    actions.append(link);
  }
  const stageControl = element('label', 'Этап переписки', 'stage-control');
  const select = element('select');
  const automatic = element('option', 'По статусу Gmail');
  automatic.value = '';
  select.append(automatic);
  for (const [value, label] of Object.entries(stages)) {
    const option = element('option', label);
    option.value = value;
    select.append(option);
  }
  const savedStage = stageOverrides[item.gmailThreadId];
  select.value = Object.hasOwn(stages, savedStage) ? savedStage : '';
  const note = element('small', 'Выбранный этап хранится в этом браузере.', 'stage-note');
  select.addEventListener('change', () => {
    if (select.value) stageOverrides[item.gmailThreadId] = select.value;
    else delete stageOverrides[item.gmailThreadId];
    showStage(currentStage(item));
    try {
      localStorage.setItem(stageKey, JSON.stringify(stageOverrides));
      note.textContent = 'Выбранный этап хранится в этом браузере.';
    } catch {
      note.textContent = 'Браузер не сохранил этап. Он сбросится при обновлении страницы.';
    }
  });
  stageControl.append(select, note);
  message.append(stageControl, actions);
  details.append(summary, message);
  return details;
}
function render() {
  const term = query.value.trim().toLocaleLowerCase('ru');
  const matches = data.messages.filter(item =>
    (!statusFilter.value || item.replyStatus === statusFilter.value) && [item.company, item.subject, item.to, item.body].join(' ').toLocaleLowerCase('ru').includes(term)
  );
  count.textContent = 'Писем: ' + matches.length + ' из ' + data.messages.length + ' · Проверка Gmail: ' + formatter.format(new Date(data.checkedAt)) + ' (UTC+5)';
  list.replaceChildren(...matches.map(letter));
  if (!matches.length) list.append(element('p', 'По вашему запросу ничего не найдено.'));
}
query.addEventListener('input', render);
statusFilter.addEventListener('change', render);
render();
</script>
